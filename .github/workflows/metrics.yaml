# Visit https://github.com/kidager/metrics#-documentation for full reference
name: Metrics

on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: kidager/metrics@f912e0ad394a69e47a6677097ebf980b6c0b56b4 # v3.35.0
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # Options
          user: kidager
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Paris
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          plugin_notable: no
